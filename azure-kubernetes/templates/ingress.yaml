apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Values.app.name }}-ingress"
  namespace: {{ .Values.namespace }}
  annotations:
    # add an annotation indicating the issuer to use.
    cert-manager.io/cluster-issuer: "{{ .Values.ingress.certName }}"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "{{ .Values.app.name }}-{{ .Values.services.frontend }}"
                port:
                  number: {{ .Values.ports.ingress }}

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: "{{ .Values.app.name }}-{{ .Values.services.backend }}"
                port:
                  number: {{ .Values.ports.ingress }}
